<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestFlix — Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="logo">TESTFLIX</div>
    <div class="login-box">
      <h1>Sign In</h1>
      <form id="login-form">
        <input type="email" id="email" placeholder="Enter your email address" autocomplete="email" required>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <div id="error" class="error"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    // If already logged in, go to media list
    if (getEmail()) {
      window.location.href = '/index.html';
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var errorEl = document.getElementById('error');
      errorEl.textContent = '';

      var email = document.getElementById('email').value.trim();
      if (!email) return;

      try {
        var res = await fetch(API + '/customers/' + encodeURIComponent(email));
        if (res.status === 404) {
          errorEl.textContent = 'Email address not found.';
          return;
        }
        if (!res.ok) {
          errorEl.textContent = 'Something went wrong. Please try again.';
          return;
        }
        var body = await res.json();
        sessionStorage.setItem('testflix_email', email);
        sessionStorage.setItem('testflix_first_name', body.data.first_name);
        window.location.href = '/index.html';
      } catch (err) {
        errorEl.textContent = 'Cannot reach the server.';
      }
    });
  </script>
</body>
</html>
