<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestFlix — Browse</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div id="media-sections">
      <p class="loading">Loading...</p>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    requireLogin();
    renderNav('list');

    (async function() {
      var sectionsEl = document.getElementById('media-sections');
      try {
        var res = await fetch(API + '/media?email=' + encodeURIComponent(getEmail()));
        if (!res.ok) {
          sectionsEl.innerHTML = '<p class="error">Failed to load media.</p>';
          return;
        }
        var body = await res.json();
        var items = body.data;

        if (!items || items.length === 0) {
          sectionsEl.innerHTML = '<p>No titles available for your subscription.</p>';
          return;
        }

        var movies = items.filter(function(i) { return i.media_type === 'movie'; });
        var shows  = items.filter(function(i) { return i.media_type === 'tvshow'; });

        sectionsEl.innerHTML = '';
        renderSection(sectionsEl, 'Movies', movies);
        renderSection(sectionsEl, 'TV Shows', shows);
      } catch (err) {
        sectionsEl.innerHTML = '<p class="error">Cannot reach the server.</p>';
      }
    })();

    function renderSection(parent, title, items) {
      if (!items.length) return;
      var h2 = document.createElement('h2');
      h2.textContent = title;
      h2.style.marginBottom = '16px';
      parent.appendChild(h2);

      var grid = document.createElement('div');
      grid.className = 'media-grid';
      items.forEach(function(item) {
        var card = document.createElement('a');
        card.href = '/media.html?id=' + item.id;
        card.className = 'media-card';
        card.innerHTML =
          '<h3>' + escapeHtml(item.title) + '</h3>' +
          '<div class="meta">' +
            '<span>' + escapeHtml(item.genre) + '</span>' +
            (item.classification ? '<span>' + escapeHtml(item.classification) + '</span>' : '') +
            (item.duration_seconds ? '<span>' + formatDuration(item.duration_seconds) + '</span>' : '') +
          '</div>';
        grid.appendChild(card);
      });
      parent.appendChild(grid);

      var spacer = document.createElement('div');
      spacer.style.marginBottom = '40px';
      parent.appendChild(spacer);
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }
  </script>
</body>
</html>
